<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="16" fill="#0a0a0a"/>

  <!-- S, built as an open architectural bracket rather than a filled glyph -->
  <path
    d="M38 22 Q38 18 32 18 L26 18 Q20 18 20 23 Q20 28 26 28 L34 28 Q40 28 40 34 Q40 40 34 40 L26 40 Q20 40 20 36"
    fill="none"
    stroke="#f5f0ea"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- status dot, the page's one recurring signature -->
  <circle cx="46" cy="18" r="4.5" fill="#c9683f"/>
  <circle cx="46" cy="18" r="4.5" fill="none" stroke="#c9683f" stroke-width="1.5" opacity="0.4">
    <animate attributeName="r" values="4.5;7.5;4.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
