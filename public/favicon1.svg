<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Void Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="12" />

  <!-- Outer Glowing AI Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="24 16" opacity="0.4" />

  <!-- Monogram SV -->
  <text x="256" y="300" font-family="'JetBrains Mono', monospace" font-size="190" font-weight="900" fill="url(#cyanGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="-6">
    SV
  </text>

  <!-- Live Pulse Dot -->
  <circle cx="390" cy="130" r="28" fill="#34d399" filter="url(#glow)" />
  <circle cx="390" cy="130" r="16" fill="#ffffff" />
</svg>
