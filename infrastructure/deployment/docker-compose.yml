version: '3.8'

services:
  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/deployment/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_HOST=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/deployment/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OPENROUTER_API_MODEL=anthropic/claude-3.5-sonnet
    volumes:
      - "../../docs:/app/docs"
